name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    # 8.6 isn't released until 2026-11-19, and dev dependencies (Valinor,
    # Pest) don't declare support for it yet, so its job may fail without
    # failing the build. Make it required once it's GA.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        dependencies: [highest]
        experimental: [false]
        include:
          - php: '8.5'
            dependencies: lowest
            experimental: false
          - php: '8.6'
            dependencies: highest
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - run: vendor/bin/pest

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  style:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/pint --test
